<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B8FFA"/>
      <stop offset="100%" style="stop-color:#4A6FD6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#g)"/>
  <!-- Dog paw -->
  <g fill="white" transform="translate(256,280)">
    <ellipse cx="0" cy="-50" rx="55" ry="50"/>
    <ellipse cx="-75" cy="-15" rx="38" ry="45" transform="rotate(-30,-75,-15)"/>
    <ellipse cx="75" cy="-15" rx="38" ry="45" transform="rotate(30,75,-15)"/>
    <ellipse cx="-55" cy="40" rx="35" ry="40" transform="rotate(-15,-55,40)"/>
    <ellipse cx="55" cy="40" rx="35" ry="40" transform="rotate(15,55,40)"/>
  </g>
  <!-- Egg shape on top -->
  <ellipse cx="256" cy="140" rx="45" ry="60" fill="white"/>
  <text x="256" y="230" font-family="Arial" font-size="36" font-weight="bold" fill="white" text-anchor="middle">蛋</text>
</svg>
